<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Rate & SpO₂ Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: black; overflow: hidden; font-family: Arial, sans-serif; }
    /* ... trimmed ... */
  </style>
</head>
<body>
  <!-- Camera feed -->
  <video id="cameraStream" autoplay playsinline></video>

  <!-- HUD for live data -->
  <div class="hud">
    ❤️ Heart Rate: <span id="hr">--</span> bpm<br>
    🌬 SpO₂: <span id="spo2">--</span> %
  </div>

  <!-- Dual charts -->
  <div class="charts">
    <canvas id="ppgChart"></canvas>
    <canvas id="spo2Chart"></canvas>
  </div>

  <!-- Injected WADL loader -->
  <script src="src/wadl-proxy.js"></script>

  <script>
    // Activate camera
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => {
        document.getElementById('cameraStream').srcObject = stream;
      })
      .catch(err => alert('Camera error: ' + err));
  </script>
</body>
</html>
